services:
  postgres:
    image: postgres:16-alpine
    container_name: f8_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      # backend chỉ khởi động sau khi Postgres thực sự nhận kết nối,
      # tránh lỗi "connection refused" lúc chạy migration.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # image: public.ecr.aws/y0g8v4d3/fls-image:latest
    working_dir: /app/api
    environment:
      - PYTHONPATH=/app/api
    env_file:
      - .env
    volumes:
      - ./backend:/app/api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    entrypoint: [ "poetry", "run" ]
    command: [ "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000" ]

  frontend:
    build: ./frontend
    container_name: f8_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # volume ẩn danh: giữ node_modules cài trong image, không để thư mục
      # host (không có node_modules) ghi đè lên.
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
